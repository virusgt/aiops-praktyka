# CI/CD Kantyny: testy na PR, na main dodatkowo build 4 obrazów → ECR → helm upgrade.
# AWS wyłącznie przez OIDC (vars.AWS_ROLE_ARN), bez kluczy w secrets.
name: ci

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Na main nie przerywamy przebiegu w trakcie helm upgrade (release zostałby w pending-upgrade).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-central-1
  EKS_CLUSTER: aiops
  HELM_VERSION: v4.3.0

jobs:
  test-orders-api:
    name: test orders-api (Python 3.12, uv)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/orders-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: app/orders-api/uv.lock
      - run: uv sync --locked
      - run: uv run --locked pytest -q

  test-payments:
    name: test payments (Go 1.23)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/payments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/payments/go.mod
          cache: true
          cache-dependency-path: app/payments/go.sum
      - run: go vet ./...
      - run: go test ./...

  helm-lint:
    name: helm lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - run: helm lint app/deploy/helm/kantyna
      - run: |
          helm template kantyna app/deploy/helm/kantyna \
            --set global.imageRegistry=registry.example \
            --set global.imageTag="$GITHUB_SHA" > /dev/null

  build:
    name: build ${{ matrix.service }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-orders-api, test-payments, helm-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # AWS OIDC: uprawnienie do uzyskania roli IAM i wysłania obrazów do ECR
    strategy:
      fail-fast: true
      matrix:
        # Bez loadgena i postgresa (make build budowałby też loadgen).
        service: [orders-api, payments, worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/${{ matrix.service }}
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
            APP_VARIANT=stable
          tags: ${{ vars.ECR_REGISTRY }}/kantyna/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    name: deploy → ${{ vars.K8S_NAMESPACE }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Bez `environment:` — zmieniłby sub tokena OIDC i trust policy roli by go odrzuciła.
    permissions:
      contents: read
      id-token: write # AWS OIDC: uprawnienie do uzyskania roli IAM i wdrożenia na EKS
    concurrency:
      group: deploy-${{ vars.K8S_NAMESPACE }}
      cancel-in-progress: false
    env:
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: helm upgrade
        run: |
          helm version --short
          # Zachowaj zatwierdzona allowliste ALB przed helm upgrade.
          kubectl -n "$K8S_NAMESPACE" get ingress kantyna-web -o json | python3 -c '
          import ipaddress, json, os, pathlib, sys
          data = json.load(sys.stdin)
          raw = data["metadata"]["annotations"]["alb.ingress.kubernetes.io/inbound-cidrs"]
          cidrs = [x.strip() for x in raw.split(",") if x.strip()]
          if len(cidrs) != 10 or len(set(cidrs)) != 10:
              raise SystemExit("BLAD: oczekiwano 10 unikalnych adresow CIDR")
          for cidr in cidrs:
              ipaddress.ip_network(cidr, strict=True)
          file = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kantyna-ingress.json"
          values = {"ingress": {"annotations": {"alb.ingress.kubernetes.io/inbound-cidrs": ",".join(cidrs)}}}
          file.write_text(json.dumps(values) + chr(10))
          print("Zachowano 10 adresow IP")
          '
          helm upgrade kantyna app/deploy/helm/kantyna --server-side=false --values "$RUNNER_TEMP/kantyna-ingress.json" \
            --namespace "$K8S_NAMESPACE" \
            --reuse-values \
            --set global.imageRegistry="$ECR_REGISTRY" \
            --set global.imageTag="$GITHUB_SHA"

      - name: rollout status
        run: |
          for d in orders-api payments worker web; do
            kubectl -n "$K8S_NAMESPACE" rollout status "deploy/kantyna-$d" --timeout=180s
          done

      - name: obrazy z tego commita
        run: |
          kubectl -n "$K8S_NAMESPACE" get deploy kantyna-orders-api kantyna-payments kantyna-worker kantyna-web \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[0].image}{"\n"}{end}' \
            | tee images.txt
          bad=$(grep -v ":${GITHUB_SHA}\$" images.txt || true)
          if [ -n "$bad" ]; then
            echo "::error::Deploymenty bez obrazu :${GITHUB_SHA}:"; echo "$bad"; exit 1
          fi

      - name: smoke test /healthz (z wnętrza klastra)
        run: |
          for url in http://127.0.0.1:8080/healthz \
                     http://kantyna-orders-api:8000/healthz \
                     http://kantyna-payments:8080/healthz; do
            echo ">> $url"
            kubectl -n "$K8S_NAMESPACE" exec deploy/kantyna-web -c web -- wget -qO- -T 5 "$url"
            echo
          done
